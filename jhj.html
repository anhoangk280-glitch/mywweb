<!DOCTYPE html>

<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chúc mừng 20/10</title>
  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      font-family: 'Arial', sans-serif;
      overflow: hidden;
      text-align: center;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
    }

    .qr-container {
      position: absolute;
      top: 20px;
      left: 20px;
      background: white;
      padding: 10px;
      border-radius: 10px;
    }

    .qr-container img {
      width: 150px;
    }

    .controls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
    }

    input {
      padding: 10px;
      width: 300px;
      font-size: 16px;
      border-radius: 5px;
      border: none;
    }

    .message {
      position: absolute;
      width: 100%;
      top: 60px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      color: #ff77aa;
    }
  </style>
</head>
<body>
  <div class="qr-container">
    ￼png" alt="QR Heart" />
    <p style="color: black; font-weight: bold;">Chúc mừng 20/10</p>
  </div>

  <div class="message" id="message">Chúc ngày 20/10 đầy ý nghĩa 💖</div>

  <div class="controls">
    <input type="text" id="inputText" placeholder="Nhập lời chúc..." />
  </div>

  <canvas id="heartCanvas"></canvas>

  <script>
    const canvas = document.getElementById("heartCanvas");
    const ctx = canvas.getContext("2d");
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    const particles = [];
    const messageEl = document.getElementById("message");

    document.getElementById("inputText").addEventListener("input", (e) => {
      messageEl.textContent = e.target.value || "Chúc ngày 20/10 đầy ý nghĩa 💖";
    });

    function heartFunction(t) {
      const x = 16 * Math.sin(t) ** 3;
      const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
      return { x, y };
    }

    for (let i = 0; i < 1000; i++) {
      const t = Math.random() * Math.PI * 2;
      const pos = heartFunction(t);
      particles.push({
        x: width / 2 + pos.x * 20,
        y: height / 2 - pos.y * 20,
        r: Math.random() * 2 + 1,
        speed: Math.random() * 0.5 + 0.5,
        angle: Math.random() * Math.PI * 2
      });
    }

    function draw() {
      ctx.fillStyle = "rgba(0, 0, 0, 0.1)";
      ctx.fillRect(0, 0, width, height);

      for (let p of particles) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = "pink";
        ctx.fill();

        p.x += Math.cos(p.angle) * p.speed;
        p.y += Math.sin(p.angle) * p.speed;

        if (p.x < 0 || p.x > width || p.y < 0 || p.y > height) {
          const t = Math.random() * Math.PI * 2;const pos = heartFunction(t);
          p.x = width / 2 + pos.x * 20;
          p.y = height / 2 - pos.y * 20;
        }
      }

      requestAnimationFrame(draw);
    }

    draw();
    window.addEventListener("resize", () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });
  </script>
</body>
</html>
